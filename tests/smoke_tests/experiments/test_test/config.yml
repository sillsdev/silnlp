# The test step is run against the test data and the checkpoint directory that are stored in this
# experiment directory, instead of running the preprocess and train steps first. The test.* files
# were created by running the preprocess step with this config, and run/checkpoint-2 is empty,
# because the test only needs the test step to resolve it - the mock model that does the
# inferencing never reads the checkpoint.
data:
  corpus_pairs:
  - src: en-BSB
    trg: es-LBLA
    corpus_books: 1JN,2JN,3JN,JUD
    test_size: 8
    val_size: 8
  lang_codes:
    en: eng_Latn
    es: spa_Latn
  terms:
    train: false
    include_glosses: false
  tokenizer:
    trained_tokens: false
    update_src: false
    update_trg: false
infer:
  infer_batch_size: 4
model: facebook/nllb-200-distilled-1.3B
