model_type: local_llm
model: hf-internal-testing/tiny-random-LlamaForCausalLM
data:
  corpus_pairs:
  - src: en-BSB
    trg: es-LBLA
    test_size: 16
  lang_codes:
    en: English
    es: Spanish
eval:
  per_device_eval_batch_size: 8
infer:
  infer_batch_size: 8
  max_new_tokens: 8
  prompt:
    num_examples: 2
    example_selection:
      method: tfidf
train:
  gradient_accumulation_steps: 8
  per_device_train_batch_size: 8
  max_steps: 8
  gradient_checkpointing: false
  prompt:
    num_examples: 2
    example_selection:
      method: tfidf
params:
  finetune_method: lora
  torch_dtype: float32
  adapter:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: all-linear
