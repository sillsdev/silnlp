# A deliberately tiny experiment: the corpus is restricted to four short books and the model is
# only trained for two steps, because the training itself is done by a mock model.
data:
  corpus_pairs:
  - src: en-BSB
    trg: es-LBLA
    corpus_books: 1JN,2JN,3JN,JUD
    test_size: 8
    val_size: 8
  lang_codes:
    en: eng_Latn
    es: spa_Latn
  terms:
    train: false
    include_glosses: false
  tokenizer:
    trained_tokens: false
    update_src: false
    update_trg: false
eval:
  per_device_eval_batch_size: 4
infer:
  infer_batch_size: 4
model: facebook/nllb-200-distilled-1.3B
train:
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 4
  max_steps: 2
  gradient_checkpointing: false
params:
  label_smoothing_factor: 0.0
