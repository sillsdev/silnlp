# The train step is run against the training and validation data that are stored in this
# experiment directory, instead of running the preprocess step first. The train.* and val.* files
# were created by running the preprocess step with this config; the files that the train step does
# not read, i.e. the test data, the detokenized data and the verse references, were not kept.
#
# The model is only trained for two steps, because the training is done by a mock model.
data:
  corpus_pairs:
  - src: en-BSB
    trg: es-LBLA
    corpus_books: 3JN,2JN,PHM
    test_size: 8
    val_size: 8
  lang_codes:
    en: eng_Latn
    es: spa_Latn
  terms:
    train: false
    include_glosses: false
  tokenizer:
    trained_tokens: false
    update_src: false
    update_trg: false
eval:
  per_device_eval_batch_size: 4
  eval_strategy: "no"
  load_best_model_at_end: false
  metric_for_best_model: null
model: facebook/nllb-200-distilled-1.3B
train:
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 4
  max_steps: 2
  gradient_checkpointing: false
params:
  label_smoothing_factor: 0.0
