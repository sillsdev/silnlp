[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silnlp"
version = "1.0.0"
description = ""
authors = [{ name = "SIL International" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "sentencepiece>=0.2.0,<0.3",
    "nltk>=3.5,<4",
    "python-dotenv==0.20.0",
    "seaborn==0.11.2",
    "morfessor>=2.0.6,<3",
    "morfessor-flatcat>=1.0.8,<2",
    "psutil>=5.7.3,<6",
    "scikit-learn>=1.1.2,<2",
    "numpy>=2.2.6,<3.0.0",
    "scipy>=1.11.2,<2",
    "clearml>=2.1.12,<3",
    "xlsxwriter>=3.2.0,<4",
    "python-levenshtein>=0.27.1,<0.28",
    "lxml>=4.6.3,<5",
    "tqdm==4.67.3",
    "sacrebleu>=2.6.0,<3",
    "sil-machine[thot]==1.9.2",
    "datasets>=5.0.1,<6",
    "torch>=2.6,<3",
    "sacremoses>=0.0.53,<0.1",
    "evaluate>=0.3.0,<0.4",
    "python-docx>=0.8.11,<0.9",
    "iso639-lang>=2.1.0,<3",
    "accelerate>=1.14.0,<2",
    "transformers>=5.14.1,<6",
    "jinja2>=3.1.2,<4",
    "peft>=0.20.0,<0.21",
    "attrs>=24.3.0,<25",
    "jsonschema>=4.18.0,<5",
    "requests>=2.31,<3",
    "openpyxl>=3.1.2,<4",
    "packaging>=24.0,<25",
    "hanzidentifier>=1.2.0,<2",
    "jarowinkler>=2.0.1,<3",
    "wildebeest-nlp>=0.9.0",
]

[project.optional-dependencies]
llm = [
    "bitsandbytes>=0.50,<0.51",
    "sentence-transformers>=6.0,<7",
    "litellm>=1.77,<2",
    "rank-bm25>=0.2.2,<0.3",
]

[project.scripts]
silnlp-extract-corpora = "silnlp.common.extract_corpora:main"
silnlp-nmt-preprocess = "silnlp.nmt.preprocess:main"
silnlp-nmt-train = "silnlp.nmt.train:main"
silnlp-nmt-test = "silnlp.nmt.test:main"
silnlp-nmt-translate = "silnlp.nmt.translate:main"
silnlp-alignment-preprocess = "silnlp.alignment.preprocess:main"
silnlp-alignment-align = "silnlp.alignment.align:main"
silnlp-alignment-test = "silnlp.alignment.test:main"
silnlp-alignment-aggregate-results = "silnlp.alignment.aggregate_results:main"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.12,<7",
    "black==24.4.1",
    "flake8>=7.1.0,<8",
    "ipykernel>=6.4.1,<7",
    "pylint>=3.0.0,<4",
    "pytest>=9.1.1,<10",
    "types-tqdm>=4.62.4,<5",
    "pandas-stubs>=2.3,<3",
    "types-regex>=2023.10.3.0,<2024",
    "lxml-stubs>=0.4.0,<0.5",
    "mypy>=1.7.1,<2",
]

[tool.setuptools.packages.find]
include = ["silnlp*"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "torch" }

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[[tool.mypy.overrides]]
module = "nltk.*"
ignore_missing_imports = true
